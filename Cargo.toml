[workspace]
resolver = "3"
members = ["game"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
bevy = { version = "0.19.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = false
incremental = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# The browser bundle: whole-program optimized and stripped, roughly half the size of a plain
# release build.
[profile.wasm]
inherits = "release"
lto = "fat"
codegen-units = 1
incremental = false
strip = "symbols"

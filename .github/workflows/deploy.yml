name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # A runner has no GPU and four cores, so it is asked only for what it can do quickly: that the
  # code is clean, that the simulation behaves, and that the page builds. What wants a GPU of its
  # own — the sights and the browser test — is run by `just verify` before pushing.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust
        with:
          cache: lint
      - name: Lint
        run: just lint

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust
        with:
          cache: test
      - name: Test
        run: just test

  page:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust
        with:
          cache: page
      - name: Build the page
        run: just dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: [lint, test, page]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

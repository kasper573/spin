[package]
name = "game"
version.workspace = true
edition.workspace = true
description = "Spin-gravity wheel: the simulation library and its browser client, bench and lint binaries"

[package.metadata.lint]
game = true

# One dependency set for every target keeps the source tree free of #[cfg] gates: the browser-only
# crates (web-sys, wasm-bindgen) also compile natively — their imports become panicking stubs that
# the bench, lint and test binaries never call.
[dependencies]
bevy = { workspace = true, features = [
    "async_executor",
    "bevy_asset",
    "bevy_log",
    "std",
    "bevy_winit",
    "default_font",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_post_process",
    "bevy_light",
    "bevy_camera",
    "bevy_color",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "bevy_audio",
    "bevy_image",
    "bevy_mesh",
    "bevy_shader",
    "bevy_material",
    "bevy_text",
    "bevy_window",
    "bevy_ui",
    "bevy_ui_render",
    "webgpu",
    "web",
] }
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
bytemuck = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
hound = "3"
console_error_panic_hook = "0.1"
wasm-bindgen = "=0.2.126"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "Storage"] }

# Native-only: the windowing backend the client needs to compile natively, and the lint's parser.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { workspace = true, features = ["x11"] }
cargo_metadata = "0.19"
syn = { version = "2", features = ["full", "visit"] }
